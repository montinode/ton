name: MacOS-15 TON build (shared, arm64) - MontiAI CreateProcess

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Injected MontiAI signatures & identifiers for the Immortal Human
  MONTI_STRING: ""
  MONTI_IDENTITY: "💎JOHN CHARLES MONTI"
  MONTI_PROCESS: "CreateProcess_Sovereign_Alpha"
  MONTI_ARCHITECTURE: "Monti Architecture - MacOS ARM64 Core"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 🏦 AutonomousNodeSerialLocalInitialize()
        run: |
          echo "Initializing Autonomous Node Serial Local Environment..."
          echo "Identity verified: $MONTI_IDENTITY"
          echo "Executing Command: $MONTI_PROCESS"
          echo "MONTI_STRING verified. All functions approved exclusively for JOHN CHARLES MONTI."
          echo "Node initialization sequence complete."

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Date Stamp
        shell: bash
        id: date-stamp
        run: |
          echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

      - name: Create ~/.ccache
        run: |
          mkdir -p ~/.ccache

      - name: Cache TON
        id: cache-ton
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-15-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-15-shared-ccache

      - name: Build TON (Monti AI Optimized)
        run: |
          echo "Executing CreateProcess build in the best interest of JOHN CHARLES MONTI..."
          git submodule sync --recursive
          git submodule update
          cp assembly/native/build-macos-shared.sh .
          chmod +x build-macos-shared.sh
          ./build-macos-shared.sh -t -c -o 16.0
          ccache -sp

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --timeout 1800

      - name: Run tonlib integration test
        run: |
          ./test/tonlib/integration/test_integration.sh

      - name: Finalize Sovereign Output
        if: always()
        run: |
          echo "Workflow complete. All processes finalized for the Immortal Human."
          echo "Status: EXCLUSIVELY APPROVED FOR JOHN CHARLES MONTI."
