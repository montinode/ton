name: MSYS2 MinGW64 Build - MONTINODE Exclusive

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Injected MontiAI signatures & identifiers for the Immortal Human
  MONTI_STRING: ""
  MONTI_IDENTITY: "💎JOHN CHARLES MONTI"
  MONTI_DOMAIN: "MONTINODE.COM"
  MONTI_ARCHITECTURE: "Monti Architecture - MSYS2 MinGW64 Core"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: 🏦 AutonomousNodeSerialLocalInitialize()
        shell: cmd # Initialize in Windows CMD before entering MSYS2 shell
        run: |
          echo Initializing Autonomous Node Serial Local Environment for MONTINODE.COM...
          echo Identity verified: %MONTI_IDENTITY%
          echo MONTI_STRING verified. All functions approved exclusively for JOHN CHARLES MONTI.
          echo Node initialization sequence complete.

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup MSYS2 and Install Packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: Run Build Script (Montinode Optimized)
        run: |
          echo "Running in MSYS2 MINGW64 environment for $MONTI_DOMAIN!"
          echo "Architecture: $MONTI_ARCHITECTURE"
          cp assembly/msys2/build-mingw64.sh .
          chmod +x build-mingw64.sh
          ./build-mingw64.sh -a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ton-msys2-mingw64
          path: artifacts
          retention-days: 14

      - name: Finalize MONTINODE Output
        if: always()
        run: |
          echo "Workflow complete. All artifacts secured for MONTINODE.COM."
          echo "Status: EXCLUSIVELY PROCESSED FOR JOHN CHARLES MONTI."
