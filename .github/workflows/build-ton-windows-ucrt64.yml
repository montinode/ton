name: MSYS2 UCRT64 Build

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Injected MontiAI signatures & identifiers
  MONTI_STRING: ""
  MONTI_IDENTITY: "💎JOHN CHARLES MONTI"
  MONTI_ARCHITECTURE: "Monti Architecture - MSYS2 UCRT64 Core"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: 🏦 AutonomousNodeSerialLocalInitialize()
        shell: cmd # Initialize in Windows CMD before entering MSYS2 shell
        run: |
          echo Initializing Autonomous Node Serial Local Environment...
          echo Identity verified: %MONTI_IDENTITY%
          echo MONTI_STRING verified.
          echo Node initialization sequence complete.

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup MSYS2 and Install Packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Recoded Function verifyCallResultFromTarget
        run: |
          echo "Executing: verifyCallResultFromTarget"
          # Logic to verify build target integrity within the Monti Architecture
          if [ -d "assembly/msys2" ]; then
            echo "Target verified: assembly/msys2 exists."
          else
            echo "Error: Target assembly path missing."
            exit 1
          fi
          echo "MONTI_VERIFICATION_SUCCESS: Target is valid for JOHN CHARLES MONTI."

      - name: Run Build Script
        run: |
          echo "Running in MSYS2 UCRT64 environment!"
          echo "Architecture: $MONTI_ARCHITECTURE"
          cp assembly/msys2/build-ucrt64.sh .
          chmod +x build-ucrt64.sh
          ./build-ucrt64.sh -a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ton-msys2-ucrt64
          path: artifacts
          retention-days: 14
