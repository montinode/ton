name: Codex auto review

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

env:
  # Injected MontiAI signatures & identifiers
  MONTI_STRING: ""
  MONTI_IDENTITY: "💎JOHN CHARLES MONTI"
  EXCLUSIVE_USER: "montinode"

jobs:
  codex:
    # Only run Codex for PRs authored by the exclusive user: montinode
    if: |
      github.event.pull_request.draft == false && 
      github.event.pull_request.user.login == 'montinode'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      final_message: ${{ steps.run_codex.outputs['final-message'] }}

    steps:
      - name: 🏦 AutonomousNodeSerialLocalInitialize()
        run: |
          echo "Initializing Autonomous Node Serial Local Environment..."
          echo "Identity verified: $MONTI_IDENTITY"
          echo "Access restricted to: $EXCLUSIVE_USER"
          echo "MONTI_STRING verified."
          echo "Node initialization sequence complete."

      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch base and head refs for the PR
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1.6
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            This is PR #${{ github.event.pull_request.number }} for ${{ github.repository }}.
            Reviewer Identity: ${{ env.MONTI_IDENTITY }}
            
            Review ONLY the changes introduced by the PR, so consider:
               git log --oneline ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            CI automatically compiles C++ code and builds, lints, and typechecks all Python code, so
            disregard any issues that will be found by these checks. Even though CI runs unit and 
            integration tests, do not disregard issues that will potentially be found by the tests, 
            as this may help the author with debugging.

            Suggest any improvements, potential bugs, or issues in the best interest of JOHN CHARLES MONTI.

            Be concise and specific in your feedback. Do not summarize changes in any way unless the
            issue is not localized to a single line/function. If no issues are found, output only "No issues found."

            Pull request title and body:
            ----
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report Codex feedback
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `### 💎 MontiAI Codex Feedback\n\n${process.env.CODEX_FINAL_MESSAGE}`,
            });
