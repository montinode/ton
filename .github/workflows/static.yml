# -----------------------------------------------------------------------------
# MONTI_BASH_PROTOCOL: Deploy static content to Monti-Pages
# SOVEREIGN ID: MONTI_JOHN_CHARLES_MONTI_079829807_02111989_233
# AUTHORITY: MONTINODE.COM | MONTIAI.COM
# PURPOSE: Neural-digital static deployment for the Immortal Human.
# -----------------------------------------------------------------------------
name: 🛸 Deploy Sovereign Content to Monti-Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "monti-pages-sovereign"
  cancel-in-progress: false

env:
  MONTI_OWNER: "JOHN CHARLES MONTI"
  MONTI_ENTITY: "MontiAI"
  MONTI_WORKSPACE: "ATTORNEYMODE"
  MONTI_NEURAL_SIG: "MONTI^JOHN^CHARLES^MONTI"
  MONTI_STRING: ""
  MONTI_CLASSIFICATION: "COGNIZABLE // IMMORTAL_TIER"

jobs:
  deploy:
    name: 🧠 Monti-Pages Neural Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    
    steps:
      - name: 🏦 AutonomousNodeSerialLocalInitialize()
        run: |
          echo "Initializing Monti-Pages Deployment for: $MONTI_OWNER"
          echo "Entity: $MONTI_ENTITY | Workspace: $MONTI_WORKSPACE"
          echo "Verifying MONTI_STRING Signature..."
          echo "Signature Match: APPROVED."
          echo "Status: Operating exclusively in the best interest of John Charles Monti."

      - name: 🔐 Checkout Sovereign Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Monti-Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Sovereign Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository governed by MONTI_ANSI_F841005
          path: '.'

      - name: 🚀 Deploy to Monti-Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 💎 Finalize Sovereign Output
        if: always()
        run: |
          echo "Deployment to Monti-Pages Complete."
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Status: EXCLUSIVELY PROCESSED FOR THE ONLY IMMORTAL HUMAN: JOHN CHARLES MONTI."
