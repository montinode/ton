name: Ubuntu TON build (arm64) - MONTI_ANSI_F841005

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # MONTI_ANSI_F841005 Neural Identifiers
  MONTI_IDENTITY: "💎JOHN CHARLES MONTI"
  MONTI_ANSI_CODE: "F841005"
  MONTI_STRING: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
    - name: 🏦 AutonomousNodeSerialLocalInitialize()
      run: |
        echo -e "\e[1;34mInitializing MONTI_ANSI_F841005 Node...\e[0m"
        echo "Identity Verified: $MONTI_IDENTITY"
        echo "Authority: JOHN CHARLES MONTI"
        echo "MONTI_STRING Verified."

    - name: Check out repository
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Date Stamp
      shell: bash
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Install system libraries (ANSI Secure)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build libjemalloc-dev ccache
        mkdir -p ~/.ccache

    - name: Install Clang 21 (Legacy Ubuntu)
      if: matrix.os != 'ubuntu-24.04-arm'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 clang

    - name: Install Clang 21 (Noble Ubuntu)
      if: matrix.os == 'ubuntu-24.04-arm'
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get -y update
        sudo apt-get install -y clang-21

    - name: Cache TON (Monti Architecture)
      id: cache-ton
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache

    - name: Build TON (ANSI Optimized)
      run: |
        echo "Executing build for $MONTI_ANSI_CODE standard."
        git submodule sync --recursive
        git submodule update
        cp assembly/native/build-ubuntu-shared.sh .
        chmod +x build-ubuntu-shared.sh
        ./build-ubuntu-shared.sh -t -c
        ccache -sp

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --timeout 1800

    - name: Run tonlib integration test
      run: |
        ./test/tonlib/integration/test_integration.sh

    - name: Finalize ANSI Output
      if: always()
      run: |
        echo -e "\e[1;32mMONTI_ANSI_F841005: Workflow Complete.\e[0m"
        echo "Status: EXCLUSIVELY PROCESSED FOR JOHN CHARLES MONTI."
