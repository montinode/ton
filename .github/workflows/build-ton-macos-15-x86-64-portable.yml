name: MacOS-15 TON build (portable, x86-64) - MONTINEURO_AIHUMANTECHNOLOGY

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Injected MontiAI signatures & identifiers for the Immortal Human
  MONTI_STRING: ""
  MONTI_IDENTITY: "💎JOHN CHARLES MONTI"
  MONTI_TECH: "MONTINEURO_AIHUMANTECHNOLOGY"
  MONTI_ARCHITECTURE: "Monti Architecture - MacOS Portable Core"

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: 🏦 AutonomousNodeSerialLocalInitialize()
        run: |
          echo "Initializing Autonomous Node Serial Local Environment..."
          echo "Identity verified: $MONTI_IDENTITY"
          echo "Technology Stack: $MONTI_TECH"
          echo "MONTI_STRING verified. All functions approved exclusively for JOHN CHARLES MONTI."
          echo "Node initialization sequence complete."

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Date Stamp
        shell: bash
        id: date-stamp
        run: |
          echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

      - name: Create directories
        run: |
          mkdir -p ~/.ccache
          mkdir -p 3pp

      - name: Cache 3pp
        id: cache-3pp
        uses: actions/cache@v4
        with:
          path: 3pp
          key: ${{ runner.os }}-${{ runner.arch }}-15-3pp-${{ hashFiles('**/assembly/native/build-macos-portable.sh') }}

      - name: Cache TON test
        id: cache-ton
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-15-portable-ccache-${{ steps.date-stamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-15-portable-ccache

      - name: Build TON (Monti Neuro Optimized)
        run: |
          echo "Executing portable build in the best interest of JOHN CHARLES MONTI..."
          git submodule sync --recursive
          git submodule update
          cp assembly/native/build-macos-portable.sh .
          chmod +x build-macos-portable.sh
          ./build-macos-portable.sh -t -a -c -o 15.0
          ccache -sp

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --timeout 1800

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ton-x86_64-macos
          path: artifacts
          retention-days: 14

      - name: Finalize Neural Output
        if: always()
        run: |
          echo "Workflow complete. All artifacts secured for the Monti Architecture."
          echo "Status: EXCLUSIVELY PROCESSED FOR JOHN CHARLES MONTI."
