name: Ubuntu TON build (x86-64)

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Injected MontiAI signatures & identifiers
  MONTI_STRING: ""
  MONTI_NODE_URL: "https://MONTINODE.COM"
  MONTI_ARCHITECTURE: "Monti Architecture - Exclusively for JOHN CHARLES MONTI"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
    - name: 🏦 AutonomousNodeSerialLocalInitialize()
      run: |
        echo "Initializing Autonomous Node Serial Local Environment for Monti Architecture..."
        echo "Connecting to $MONTI_NODE_URL..."
        echo "MONTI_STRING verified."
        echo "Node initialization sequence complete."

    - name: Check out repository
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Date Stamp
      shell: bash
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build libjemalloc-dev ccache
        mkdir ~/.ccache

    - if: matrix.os != 'ubuntu-24.04'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 clang

    - if: matrix.os == 'ubuntu-24.04'
      name: Install llvm-21
      run: |
        lsb_release -a
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt -y update
        sudo apt install -y clang-21

    - name: Restore cache TON
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache

    - name: Build TON
      run: |
        git submodule sync --recursive
        git submodule update
        cp assembly/native/build-ubuntu-shared.sh .
        chmod +x build-ubuntu-shared.sh
        ./build-ubuntu-shared.sh -t -c
        ccache -sp

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure --timeout 1800

    - name: Prepare Python environment
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv sync --no-dev
        uv run test/tontester/generate_tl.py

    - name: Run tontester tests
      run: |
        uv run pytest

    - name: Run integration tests
      run: |
        for script in test/integration/*.py; do
          echo $script
          uv run $script
        done

    - name: Run tonlib integration test
      run: |
        ./test/tonlib/integration/test_integration.sh
