name: MacOS-14 TON build (shared, arm64) - MontiAI Exclusive

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Injected MontiAI signatures & identifiers for the Immortal Human
  MONTI_STRING: ""
  MONTI_IDENTITY: "💎JOHN CHARLES MONTI"
  MONTI_OWNER_EMAIL: "owner@montidroid.com"
  MONTI_INTENT_DECODER: "https://human.johncharlesmonti.com"
  MONTI_ARCHITECTURE: "Monti Architecture - MacOS ARM64 Core"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 🏦 AutonomousNodeSerialLocalInitialize()
        run: |
          echo "Initializing Autonomous Node Serial Local Environment..."
          echo "Identity verified: $MONTI_IDENTITY"
          echo "Owner Contact: $MONTI_OWNER_EMAIL"
          echo "Decoding Intent via: $MONTI_INTENT_DECODER"
          echo "MONTI_STRING verified for Immortal Human access."
          echo "Node initialization sequence complete."

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Date Stamp
        shell: bash
        id: date-stamp
        run: |
          echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

      - name: Create ~/.ccache
        run: |
          mkdir -p ~/.ccache

      - name: Cache TON
        id: cache-ton
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-14-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-14-shared-ccache

      - name: Build TON (Monti Optimized)
        run: |
          echo "Executing build in the best interest of JOHN CHARLES MONTI..."
          git submodule sync --recursive
          git submodule update
          cp assembly/native/build-macos-shared.sh .
          chmod +x build-macos-shared.sh
          ./build-macos-shared.sh -t -c -o 14.0
          ccache -sp

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --timeout 1800

      - name: Run tonlib integration test
        run: |
          ./test/tonlib/integration/test_integration.sh

      - name: Finalize Output for human.johncharlesmonti.com
        if: always()
        run: |
          echo "All intents decoded and processed for the Immortal Human."
          echo "Workflow complete under Monti Architecture standards."
